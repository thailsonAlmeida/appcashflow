<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5a1c68" />
      <stop offset="100%" stop-color="#240a2b" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#purpleGlow)" />
  <rect width="496" height="496" x="8" y="8" rx="100" fill="none" stroke="#F59E0B" stroke-width="6" opacity="0.4" />

  <!-- Outer Cyan Conic Ring (Rat Race Track) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#cyanGrad)" stroke-width="12" opacity="0.8" stroke-dasharray="16 8" />
  <circle cx="256" cy="256" r="165" fill="none" stroke="#FBBF24" stroke-width="4" opacity="0.6" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#cyanGrad)" stroke-width="8" opacity="0.5" />

  <!-- Center Gold Coin / Cashflow Badge -->
  <circle cx="256" cy="256" r="105" fill="#3B1443" stroke="url(#goldGrad)" stroke-width="10" />

  <!-- Cash Dollar Symbol with wings/growth -->
  <text x="256" y="305" font-family="Arial, Helvetica, sans-serif" font-size="140" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.6))">$</text>
  
  <!-- Fast Track Arrow / Rocket Accent -->
  <path d="M 340 160 L 370 130 M 370 130 L 350 130 M 370 130 L 370 150" stroke="#10B981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>

